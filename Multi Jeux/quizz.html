<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Jeux - Quiz</title>
    <link rel="stylesheet" href="css/quizz.css">
</head>

<body>

    <header class="header">
        <div class="header-content">
            <h1 class="header-titre">Quizz</h1>
            <img src="imageapp/Multi-Jeux.png" alt="Logo Multi-Jeux" class="header-logo" />
        </div>
    </header>

    <section class="quiz-container">

        <p id="dernierScore"></p>

        <!-- QUESTION 1 -->
        <h3 id="question1"></h3>
        <div class="question-block">
            <label><input type="radio" name="q1" id="q1r1"></label>
            <label><input type="radio" name="q1" id="q1r2"></label>
            <label><input type="radio" name="q1" id="q1r3"></label>
            <label><input type="radio" name="q1" id="q1r4"></label>
        </div>

        <!-- QUESTION 2 -->
        <h3 id="question2"></h3>
        <div class="question-block">
            <label><input type="radio" name="q2" id="q2r1"></label>
            <label><input type="radio" name="q2" id="q2r2"></label>
            <label><input type="radio" name="q2" id="q2r3"></label>
            <label><input type="radio" name="q2" id="q2r4"></label>
        </div>

        <!-- QUESTION 3 -->
        <h3 id="question3"></h3>
        <div class="question-block">
            <label><input type="radio" name="q3" id="q3r1"></label>
            <label><input type="radio" name="q3" id="q3r2"></label>
            <label><input type="radio" name="q3" id="q3r3"></label>
            <label><input type="radio" name="q3" id="q3r4"></label>
        </div>

        <!-- QUESTION 4 -->
        <h3 id="question4"></h3>
        <div class="question-block">
            <label><input type="radio" name="q4" id="q4r1"></label>
            <label><input type="radio" name="q4" id="q4r2"></label>
            <label><input type="radio" name="q4" id="q4r3"></label>
            <label><input type="radio" name="q4" id="q4r4"></label>
        </div>

        <!-- QUESTION 5 -->
        <h3 id="question5"></h3>
        <div class="question-block">
            <label><input type="radio" name="q5" id="q5r1"></label>
            <label><input type="radio" name="q5" id="q5r2"></label>
            <label><input type="radio" name="q5" id="q5r3"></label>
            <label><input type="radio" name="q5" id="q5r4"></label>
        </div>

        <p id="score"></p>

        <button id="submitBtn">Valider</button>
        <button id="corrigerBtn" class="btn">Montrer le corrigé</button>
        <button id="restartBtn" class="btn">Recommencer le test</button>

        <a href="./index.html">
            <button class="btn">Retour</button>
        </a>

    </section>

    <script src="quizz.js"></script>

</body>

</html>
